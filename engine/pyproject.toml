[project]
name = "mahjong-engine"
version = "0.0.1"
description = "Pure Python Riichi Mahjong rule engine (no I/O)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Riichi Mahjong contributors" }]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mahjong_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]
# 中文注释/文档里的合法全角标点，放行以免 RUF001/002/003 误报
allowed-confusables = ["×", "："]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
